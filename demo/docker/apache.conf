# AtroPIM demo: Apache serves public/ (the entrypoint replaces 8080 with $PORT).
<VirtualHost *:8080>
    DocumentRoot /var/www/atro/public
    <Directory /var/www/atro/public/>
        AllowOverride All
        Require all granted
    </Directory>
    <IfModule php_module>
        php_admin_value memory_limit 512M
        php_admin_value max_execution_time 600
        php_admin_value post_max_size 20M
        php_admin_value upload_max_filesize 20M
    </IfModule>
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 "%h %l %u %t \"%r\" %>s %b"
</VirtualHost>
